<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU - MTs ASSALAM</title>
<style>*{box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;margin:0;background:#fff7e6}.header{background:linear-gradient(135deg,#ff8a00,#ffab40);color:#fff;padding:18px 16px 24px;text-align:center;border-radius:0 0 22px 22px}.card{background:#fff;max-width:650px;margin:-14px auto 20px;padding:18px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}input,select,textarea{width:100%;padding:10px;margin:5px 0 8px;border-radius:10px;border:1.5px solid #ddd;font-size:14px}button{padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px}.hijau{background:#0b6e4f;color:#fff}.biru{background:#1976d2;color:#fff}.merah{background:#d32f2f;color:#fff}.kuning{background:#ff8a00;color:#fff}.ungu{background:#7b1fa2;color:#fff}.box{background:#fdfdfd;border:1.5px solid #eee;padding:12px;border-radius:12px;margin-bottom:10px}.hapus{background:#ff5252;color:#fff;width:auto;padding:5px 10px;float:right;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 button{width:100%}.judul{font-weight:800;text-align:center;margin:14px 0 4px}</style></head>
<body><div style="position:relative;border-radius:16px;overflow:hidden;margin:10px;box-shadow:0 4px 15px rgba(0,0,0,.25)"><img src="gedung.jpg" style="width:100%;height:190px;object-fit:cover;display:block"><div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(4,20,90,.88))"></div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;padding:12px"><img src="logo.png" style="width:78px;height:78px;background:white;border-radius:50%;padding:5px;object-fit:contain;border:3px solid #ffcc00"><div style="font-size:21px;font-weight:900;margin-top:8px;line-height:1.1">MTs ASSALAM LEMAH SUGIH</div><div style="font-size:12px;opacity:.95">Kec. Lemah Sugih - Kab. Majalengka</div><div style="margin-top:9px;background:#ffcc00;color:#0b2ea8;font-weight:900;font-size:13px;padding:6px 16px;border-radius:20px">📚 PANEL GURU - UJIAN ONLINE</div></div></div>
<div class="card"><label>📚 Mapel</label><select id="mapel"><option>AL-QUR'AN HADIS</option><option>AKIDAH AKHLAK</option><option>FIQIH</option><option>SKI</option><option>BAHASA ARAB</option><option>BTQ</option><option>BAHASA INDONESIA</option><option>BAHASA INGGRIS</option><option>MATEMATIKA</option><option>IPA</option><option>IPS</option><option>PPKN</option><option>PJOK</option><option>PRAKARYA</option><option>INFORMATIKA</option><option>SENI BUDAYA</option><option>MULOK BAHASA SUNDA</option></select>
<label>🏫 Kelas</label><select id="kelas"><option>VII-A</option><option>VII-B</option><option>VIII-A</option><option>VIII-B</option><option>IX-A</option><option>IX-B</option></select>
<p class="judul">📥 TEMPLATE 50 SOAL - ISI DI EXCEL</p>
<div class="grid2"><button class="kuning" onclick="downloadTemplate()">⬇️ DOWNLOAD TEMPLATE</button><button class="ungu" onclick="document.getElementById('fileTemplate').click()">⬆️ UPLOAD TEMPLATE</button></div>
<input type="file" id="fileTemplate" accept=".csv" style="display:none" onchange="uploadTemplate(this)">
<p style="text-align:center;font-size:11px;color:#888;margin:2px 0">Download -> Isi 50 soal di Excel -> Upload -> Langsung jadi 50 kotak soal</p>
<div id="listSoal"></div>
<div class="grid2"><button class="biru" onclick="tambahPG()">+ PG</button><button class="biru" onclick="tambahEssay()">+ ESSAY</button></div>
<button class="hijau" style="width:100%" onclick="simpan()">💾 SIMPAN SOAL (Masih Terkunci)</button>
<p class="judul">🔐 KONTROL UJIAN SISWA</p>
<div class="grid2"><button class="hijau" style="background:#2e7d32" onclick="bukaUjian()">🟢 BUKA UJIAN</button><button class="merah" onclick="tutupUjian()">🔴 TUTUP UJIAN</button></div>
<p style="text-align:center;font-size:11px;color:#888">Klik BUKA saat jam ujian mulai.<br>Klik TUTUP saat jam ujian selesai.</p>
<button class="merah" style="width:100%" onclick="hapusSemua()">🗑️ HAPUS SEMUA DATA UJI</button>
<p id="status" style="text-align:center;font-weight:800"></p></div>
<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbz2hCqcDkO15hsVd9NSLLrQruVQWUfKwIhBpdc1SFq_1p96tnsPPg-jw_t63PGzxQ/exec";
let nomor=0;
function tambahPG(){ nomor++; let d=document.createElement('div'); d.className='box'; d.innerHTML="<b>📝 Soal PG "+nomor+"</b><button class='hapus' onclick='this.parentElement.remove()'>Hapus</button><textarea class='soal' placeholder='Tulis soal disini...'></textarea><input class='a' placeholder='Jawaban A'><input class='b' placeholder='Jawaban B'><input class='c' placeholder='Jawaban C'><input class='d' placeholder='Jawaban D'><label>Kunci Jawaban</label><select class='kunci'><option>A</option><option>B</option><option>C</option><option>D</option></select><input type='hidden' class='tipe' value='PG'>"; document.getElementById('listSoal').appendChild(d); pasangTombolGambar(); }
function tambahEssay(){ nomor++; let d=document.createElement('div'); d.className='box'; d.style.background='#e8f5e9'; d.innerHTML="<b>✍️ Soal ESSAY "+nomor+"</b><button class='hapus' onclick='this.parentElement.remove()'>Hapus</button><textarea class='soal' placeholder='Tulis soal essay disini...'></textarea><input type='hidden' class='tipe' value='ESSAY'>"; document.getElementById('listSoal').appendChild(d); pasangTombolGambar(); }
// === ANTI DOBEL ===
let lagiMenyimpan=false;
let sudahSimpan={}; try{ sudahSimpan=JSON.parse(localStorage.getItem('sudah_simpan')||'{}'); }catch(e){ sudahSimpan={}; }
function simpan(){
  if(lagiMenyimpan){ alert("Lagi menyimpan, tunggu bentar bos..."); return; }
  let boxes=document.querySelectorAll('.box'); if(boxes.length==0){alert("Belum ada soal!");return;}
  let lihat={}; let dobel="";
  boxes.forEach((b,i)=>{ let teks=(b.querySelector('.soal').value||"").trim().toLowerCase().replace(/\s+/g,' '); if(!teks) return; if(lihat[teks]){ dobel+="Soal No."+lihat[teks]+" sama dengan Soal No."+(i+1)+" : "+teks.substring(0,50)+"\n"; } else { lihat[teks]=i+1; } });
  if(dobel){ alert("⛔ ADA SOAL DOBEL BOS!\n\n"+dobel+"\nHapus salah satu dulu baru SIMPAN."); return; }
  let kosong=0; boxes.forEach(b=>{ if(!(b.querySelector('.soal').value||"").trim()) kosong++; });
  if(kosong>0){ if(!confirm("Ada "+kosong+" soal masih kosong. Tetap simpan?")) return; }
  let kunciMK=document.getElementById('mapel').value+" | "+document.getElementById('kelas').value;
  if(sudahSimpan[kunciMK]){ if(!confirm("⚠️ PERHATIAN!\n\n"+kunciMK+" ini SUDAH PERNAH DISIMPAN tanggal "+sudahSimpan[kunciMK]+".\n\nKalau SIMPAN lagi, soal lama bisa KETIMPA / DOBEL di Sheet.\n\nYakin mau simpan lagi? OK = timpa, Cancel = batal, cek lagi Mapel/Kelas.")){ return; } }
  let soalList=[]; boxes.forEach(b=>{ let t=b.querySelector('.tipe').value; if(t=="PG") soalList.push({tipe:"PG",soal:b.querySelector('.soal').value,a:b.querySelector('.a').value,b:b.querySelector('.b').value,c:b.querySelector('.c').value,d:b.querySelector('.d').value,kunci:b.querySelector('.kunci').value}); else soalList.push({tipe:"ESSAY",soal:b.querySelector('.soal').value}); });
  lagiMenyimpan=true; document.getElementById('status').innerText="Menyimpan... Jangan klik 2x!";
  fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"simpanSoal",mapel:document.getElementById('mapel').value,kelas:document.getElementById('kelas').value,soalList:soalList})}).then(()=>{ sudahSimpan[kunciMK]=new Date().toLocaleString('id-ID'); localStorage.setItem('sudah_simpan',JSON.stringify(sudahSimpan)); lagiMenyimpan=false; document.getElementById('status').innerText="✅ SOAL TERSIMPAN TAPI MASIH TERKUNCI! Klik BUKA UJIAN kalau sudah waktunya."; alert("Soal tersimpan, tapi SISWA BELUM BISA BUKA. Klik tombol BUKA UJIAN saat jam ujian!"); });
}
function bukaUjian(){ fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"bukaUjian",mapel:document.getElementById('mapel').value,kelas:document.getElementById('kelas').value})}).then(()=>{alert("🟢 UJIAN DIBUKA! Siswa sekarang bisa masuk "+document.getElementById('mapel').value+" "+document.getElementById('kelas').value);}); }
function tutupUjian(){ fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"tutupUjian",mapel:document.getElementById('mapel').value,kelas:document.getElementById('kelas').value})}).then(()=>{alert("🔴 UJIAN DITUTUP! Siswa tidak bisa masuk lagi.");}); }
function hapusSemua(){ if(prompt("Password Admin:")!=="MTs 2026"){alert("Password Salah!");return;} if(!confirm("YAKIN hapus semua?")) return; fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"hapusData"})}).then(()=>{alert("Semua data terhapus!");}); }
// === TEMPLATE 50 SOAL ===
function downloadTemplate(){ let csv="tipe,soal,a,b,c,d,kunci\n"; csv+="PG,Contoh: Apa ibu kota Indonesia?,Jakarta,Bandung,Surabaya,Medan,A\n"; for(let i=2;i<=50;i++){ csv+="PG,,,,,,\n"; } csv+="ESSAY,Contoh soal essay,,,,,\n"; let blob=new Blob(["\ufeff"+csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="Template-50-Soal-"+document.getElementById('mapel').value+"-"+document.getElementById('kelas').value+".csv"; a.click(); }
function uploadTemplate(input){ let f=input.files[0]; if(!f) return; let r=new FileReader(); r.onload=function(e){ let lines=e.target.result.split("\n"); let count=0; let lihatUp={}; let dobelUp=""; lines.forEach((line,idx)=>{ if(idx==0||!line.trim()) return; let cols=line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim()); if(!cols[1]) return; let teksUp=cols[1].trim().toLowerCase(); if(lihatUp[teksUp]){ dobelUp+=cols[1].substring(0,40)+"\n"; return; } lihatUp[teksUp]=1; if(cols[0].toUpperCase().includes("ESSAY")){ tambahEssay(); let boxes=document.querySelectorAll('.box'); boxes[boxes.length-1].querySelector('.soal').value=cols[1]; } else { tambahPG(); let boxes=document.querySelectorAll('.box'); let b=boxes[boxes.length-1]; b.querySelector('.soal').value=cols[1]||""; b.querySelector('.a').value=cols[2]||""; b.querySelector('.b').value=cols[3]||""; b.querySelector('.c').value=cols[4]||""; b.querySelector('.d').value=cols[5]||""; if(cols[6]) b.querySelector('.kunci').value=cols[6].toUpperCase(); } count++; }); simpanDraf(); if(dobelUp) alert("⚠️ Ada soal dobel di file Template, yang dobel di-skip:\n"+dobelUp); alert("✅ "+count+" soal dari Template berhasil dimuat! Cek dulu, lalu klik SIMPAN SOAL."); }; r.readAsText(f); }
// === DRAF ===
let lagiMuat=false;
function getKunci(){ return 'draf_' + document.getElementById('mapel').value + '_' + document.getElementById('kelas').value; }
function simpanDraf(){ if(lagiMuat) return; let wadah=document.getElementById('listSoal'); wadah.querySelectorAll('input, textarea, select').forEach(function(el){ if(el.type==='checkbox'||el.type==='radio'){ if(el.checked) el.setAttribute('checked','checked'); else el.removeAttribute('checked'); } else { el.setAttribute('value',el.value); } if(el.tagName==='TEXTAREA') el.textContent=el.value; }); localStorage.setItem(getKunci(),wadah.innerHTML); localStorage.setItem('terakhir',document.getElementById('mapel').value+'|'+document.getElementById('kelas').value); }
function muatDraf(){ lagiMuat=true; let s=localStorage.getItem(getKunci()); if(s){document.getElementById('listSoal').innerHTML=s;nomor=document.querySelectorAll('.box').length;} else{document.getElementById('listSoal').innerHTML='';tambahPG();} lagiMuat=false; }
document.getElementById('mapel').onchange=muatDraf;
document.getElementById('kelas').onchange=muatDraf;
muatDraf();
document.addEventListener('input',function(){ simpanDraf(); });
// === GAMBAR PERMANEN ===
function pasangTombolGambar(){ document.querySelectorAll('textarea').forEach(t=>{ if(t.dataset.gambar) return; t.dataset.gambar='1'; let b=document.createElement('button'); b.type='button'; b.textContent='📷 Tambah Gambar'; b.style='margin:5px 0;padding:6px 10px;background:#22c55e;color:white;border:none;border-radius:8px;cursor:pointer;display:block'; let inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.style.display='none'; b.onclick=()=>inp.click(); inp.onchange=()=>{ let f=inp.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{ let img=new Image(); img.onload=()=>{ let c=document.createElement('canvas'); let max=800; let w=img.width,h=img.height; if(w>max){h=h*max/w;w=max;} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); let kecil=c.toDataURL('image/jpeg',0.7); let prev=document.createElement('img'); prev.src=kecil; prev.style='max-width:300px;display:block;margin:5px 0;border:1px solid #ddd;border-radius:8px'; t.after(prev); t.value+='\n[GAMBAR]'+kecil; alert('Gambar tos kapasang! Pencet SIMPAN SOAL Bos!'); }; img.src=e.target.result; }; r.readAsDataURL(f); }; t.after(b); t.after(inp); }); }
setInterval(pasangTombolGambar,1000);
pasangTombolGambar();
</script>
</body>
</html>
