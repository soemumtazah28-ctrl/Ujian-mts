<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU - MTs ASSALAM</title>
<style>*{box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;margin:0;background:#fff7e6}.header{background:linear-gradient(135deg,#ff8a00,#ffab40);color:#fff;padding:22px 16px 30px;text-align:center;border-radius:0 0 28px 28px}.card{background:#fff;max-width:650px;margin:-18px auto 20px;padding:22px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.08)}input,select,textarea{width:100%;padding:12px;margin:6px 0 10px;border-radius:12px;border:1.5px solid #ddd;font-size:15px}button{padding:13px;width:100%;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}.hijau{background:#0b6e4f;color:#fff}.biru{background:#1976d2;color:#fff}.merah{background:#d32f2f;color:#fff}.box{background:#fdfdfd;border:1.5px solid #eee;padding:14px;border-radius:14px;margin-bottom:12px}.hapus{background:#ff5252;color:#fff;width:auto;padding:6px 12px;float:right;font-size:12px}</style></head>
<body><div class="header"><div style="font-size:42px">👨‍🏫</div><h1 style="margin:5px 0">PANEL GURU</h1><p style="margin:0;opacity:.9">MTs ASSALAM LEMAH SUGIH</p></div>
<div class="card"><label>📚 Mapel</label><select id="mapel"><option>AL-QUR'AN HADIS</option><option>AKIDAH AKHLAK</option><option>FIQIH</option><option>SKI</option><option>BAHASA ARAB</option><option>BTQ</option><option>BAHASA INDONESIA</option><option>BAHASA INGGRIS</option><option>MATEMATIKA</option><option>IPA</option><option>IPS</option><option>PPKN</option><option>PJOK</option><option>PRAKARYA</option><option>INFORMATIKA</option><option>SENI BUDAYA</option><option>MULOK BAHASA SUNDA</option></select>
<label>🏫 Kelas</label><select id="kelas"><option>VII-A</option><option>VII-B</option><option>VIII-A</option><option>VIII-B</option><option>IX-A</option><option>IX-B</option></select>
<div id="listSoal"></div>
<button class="biru" onclick="tambahPG()">+ TAMBAH SOAL PILIHAN GANDA</button>
<button class="biru" onclick="tambahEssay()">+ TAMBAH SOAL ESSAY</button>
<button class="hijau" onclick="simpan()">💾 SIMPAN SOAL (Masih Terkunci)</button>
<hr><p style="text-align:center;font-weight:800">🔐 KONTROL UJIAN SISWA</p>
<button class="hijau" style="background:#2e7d32" onclick="bukaUjian()">🟢 BUKA UJIAN UNTUK SISWA</button>
<button class="merah" onclick="tutupUjian()">🔴 TUTUP UJIAN</button>
<p style="text-align:center;font-size:12px;color:#888">Klik BUKA saat jam ujian mulai.<br>Klik TUTUP saat jam ujian selesai.</p>
<hr><button class="merah" onclick="hapusSemua()">🗑️ HAPUS SEMUA DATA UJI</button>
<p id="status" style="text-align:center;font-weight:800"></p></div>
<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbz2hCqcDkO15hsVd9NSLLrQruVQWUfKwIhBpdc1SFq_1p96tnsPPg-jw_t63PGzxQ/exec";
let nomor=0;
function tambahPG(){ nomor++; let d=document.createElement('div'); d.className='box'; d.innerHTML="<b>📝 Soal PG "+nomor+"</b><button class='hapus' onclick='this.parentElement.remove()'>Hapus</button><textarea class='soal' placeholder='Tulis soal disini...'></textarea><input class='a' placeholder='Jawaban A'><input class='b' placeholder='Jawaban B'><input class='c' placeholder='Jawaban C'><input class='d' placeholder='Jawaban D'><label>Kunci Jawaban</label><select class='kunci'><option>A</option><option>B</option><option>C</option><option>D</option></select><input type='hidden' class='tipe' value='PG'>"; document.getElementById('listSoal').appendChild(d); }
function tambahEssay(){ nomor++; let d=document.createElement('div'); d.className='box'; d.style.background='#e8f5e9'; d.innerHTML="<b>✍️ Soal ESSAY "+nomor+"</b><button class='hapus' onclick='this.parentElement.remove()'>Hapus</button><textarea class='soal' placeholder='Tulis soal essay disini...'></textarea><input type='hidden' class='tipe' value='ESSAY'>"; document.getElementById('listSoal').appendChild(d); }
function simpan(){ let boxes=document.querySelectorAll('.box'); if(boxes.length==0){alert("Belum ada soal!");return;} let soalList=[]; boxes.forEach(b=>{ let t=b.querySelector('.tipe').value; if(t=="PG") soalList.push({tipe:"PG",soal:b.querySelector('.soal').value,a:b.querySelector('.a').value,b:b.querySelector('.b').value,c:b.querySelector('.c').value,d:b.querySelector('.d').value,kunci:b.querySelector('.kunci').value}); else soalList.push({tipe:"ESSAY",soal:b.querySelector('.soal').value}); }); document.getElementById('status').innerText="Menyimpan..."; fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"simpanSoal",mapel:document.getElementById('mapel').value,kelas:document.getElementById('kelas').value,soalList:soalList})}).then(()=>{document.getElementById('status').innerText="✅ SOAL TERSIMPAN TAPI MASIH TERKUNCI! Klik BUKA UJIAN kalau sudah waktunya."; alert("Soal tersimpan, tapi SISWA BELUM BISA BUKA. Klik tombol BUKA UJIAN saat jam ujian!");}); }
function bukaUjian(){ fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"bukaUjian",mapel:document.getElementById('mapel').value,kelas:document.getElementById('kelas').value})}).then(()=>{alert("🟢 UJIAN DIBUKA! Siswa sekarang bisa masuk "+document.getElementById('mapel').value+" "+document.getElementById('kelas').value);}); }
function tutupUjian(){ fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"tutupUjian",mapel:document.getElementById('mapel').value,kelas:document.getElementById('kelas').value})}).then(()=>{alert("🔴 UJIAN DITUTUP! Siswa tidak bisa masuk lagi.");}); }
function hapusSemua(){ if(prompt("Password Admin:")!=="MTs 2026"){alert("Password Salah!");return;} if(!confirm("YAKIN hapus semua?")) return; fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"hapusData"})}).then(()=>{alert("Semua data terhapus!");}); }
tambahPG();


  </script>
</body>
</html>
