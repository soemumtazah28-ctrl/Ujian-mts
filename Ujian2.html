<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UJIAN - MTs ASSALAM</title>
<style>*{box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;margin:0;background:#eef2f7}.header{background:#1a237e;color:#fff;padding:22px 16px 30px;text-align:center;border-radius:0 0 28px 28px}.card{background:#fff;max-width:650px;margin:-18px auto 20px;padding:22px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.08)}input,select,textarea{width:100%;padding:12px;margin:6px 0 10px;border-radius:12px;border:1.5px solid #ddd;font-size:15px}button{padding:14px;width:100%;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}.biru{background:#1976d2;color:#fff}.hijau{background:#0b6e4f;color:#fff}.opt{border:1.5px solid #eee;padding:12px;border-radius:12px;margin:6px 0;cursor:pointer}.opt.pilih{background:#e3f2fd;border-color:#1976d2}</style></head>
<body><div class="header"><div style="font-size:40px">🕌</div><h1 style="margin:5px 0">MTs ASSALAM</h1><p style="margin:0;opacity:.9">LEMAHSUGIH • UJIAN ONLINE</p><div style="background:#ffcc80;color:#000;display:inline-block;padding:6px 18px;border-radius:20px;margin-top:12px;font-weight:800;font-size:13px">✨ Semangat! Kamu Pasti Bisa ✨</div></div>
<div class="card" id="loginBox"><h3 style="text-align:center">📝 MASUK UJIAN</h3><label>Nama Lengkap</label><input id="nama" placeholder="Contoh: Ahmad Hilqy"><label>Kelas</label><select id="kelas"><option>VII-A</option><option>VII-B</option><option>VIII-A</option><option>VIII-B</option><option>IX-A</option><option>IX-B</option></select><label>Mapel</label><select id="mapel"><option>AL-QUR'AN HADIS</option><option>AKIDAH AKHLAK</option><option>FIQIH</option><option>SKI</option><option>BAHASA ARAB</option><option>BTQ</option><option>BAHASA INDONESIA</option><option>BAHASA INGGRIS</option><option>MATEMATIKA</option><option>IPA</option><option>IPS</option><option>PPKN</option><option>PJOK</option><option>PRAKARYA</option><option>INFORMATIKA</option><option>SENI BUDAYA</option><option>MULOK BAHASA SUNDA</option></select><button class="biru" onclick="mulai()">🚀 MULAI UJIAN</button><p id="info" style="text-align:center;font-size:13px;color:#888">Pastikan Guru sudah klik BUKA UJIAN untuk mapel ini.</p></div>
<div class="card" id="soalBox" style="display:none"><div id="soalArea"></div><button class="hijau" onclick="kirim()">✅ KIRIM JAWABAN</button></div>
<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbz2hCqcDkO15hsVd9NSLLrQruVQWUfKwIhBpdc1SFq_1p96tnsPPg-jw_t63PGzxQ/exec";
let SOAL=[], NAMA="", KELAS_SISWA="", MAPEL_SISWA="", JAWAB_PG={}, JAWAB_ESSAY={};
function mulai(){
  NAMA=document.getElementById('nama').value.trim();
  if(!NAMA){alert("Isi nama dulu!");return;}
  KELAS_SISWA=document.getElementById('kelas').value;
  MAPEL_SISWA=document.getElementById('mapel').value;
  document.getElementById('info').innerText="Mengecek apakah guru sudah membuka ujian...";
  fetch(URL_SCRIPT+"?mapel="+encodeURIComponent(MAPEL_SISWA)+"&kelas="+encodeURIComponent(KELAS_SISWA)).then(r=>r.json()).then(data=>{
    if(data.error=="BELUM_DIBUKA"){ alert("⛔ UJIAN "+MAPEL_SISWA+" BELUM DIBUKA OLEH GURU!\nTunggu perintah guru ya, jangan buka mapel lain!"); document.getElementById('info').innerText="Belum dibuka guru."; return; }
    SOAL=data;
    if(!SOAL || SOAL.length==0){ alert("Soal belum diupload guru untuk "+MAPEL_SISWA+" kelas "+KELAS_SISWA); return; }
    document.getElementById('loginBox').style.display='none';
    document.getElementById('soalBox').style.display='block';
    tampilSoal();
  }).catch(e=>{ alert("Gagal konek ke server, cek internet / link script!"); });
}
function tampilSoal(){
  let h="<h3>"+MAPEL_SISWA+" - "+KELAS_SISWA+"</h3><p>Nama: <b>"+NAMA+"</b></p><hr>";
  SOAL.forEach((q,i)=>{
    h+="<p><b>Soal "+(i+1)+".</b> "+q.soal+"</p>";
    if(q.tipe=="PG"){
      ["A","B","C","D"].forEach(k=>{
        let val = k=="A"?q.a : k=="B"?q.b : k=="C"?q.c : q.d;
        h+="<div class='opt' onclick=\"pilih("+i+",'"+k+"',this)\"><b>"+k+".</b> "+val+"</div>";
      });
    } else {
      h+="<textarea oninput=\"JAWAB_ESSAY["+i+"]=this.value\" placeholder='Tulis jawaban essay disini...'></textarea>";
    }
  });
  document.getElementById('soalArea').innerHTML=h;
}
function pilih(i,k,el){
  JAWAB_PG[i]=k;
  let p=el.parentElement.querySelectorAll('.opt'); p.forEach(x=>x.classList.remove('pilih'));
  el.classList.add('pilih');
}
function kirim(){
  let nilai=0, totalPG=0;
  SOAL.forEach((q,i)=>{ if(q.tipe=="PG"){ totalPG++; if(JAWAB_PG[i]==q.kunci) nilai++; } });
  let nilaiPG = totalPG>0 ? Math.round(nilai/totalPG*100) : 0;
  if(!confirm("Kirim jawaban? Nilai PG kamu: "+nilaiPG)){return;}
  fetch(URL_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:"kirimJawaban",nama:NAMA,kelas:KELAS_SISWA,mapel:MAPEL_SISWA,nilaiPG:nilaiPG,jawabanPG:JAWAB_PG,jawabanEssay:JAWAB_ESSAY})}).then(()=>{ alert("✅ Jawaban terkirim! Nilai PG: "+nilaiPG+"\nTerima kasih "+NAMA); location.reload(); });
}
</script></body></html>
